<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .node { fill: #00FF66; }
      .core-node { fill: #FFFFFF; filter: drop-shadow(0 0 8px rgba(0,255,102,0.8)); }
      .link { stroke: #00FF66; stroke-opacity: 0.15; stroke-width: 1; }
      .active-link { stroke: #00FF66; stroke-opacity: 0.6; stroke-width: 1.5; stroke-dasharray: 8 20; animation: dash 3s linear infinite; }
      
      @keyframes dash {
        to { stroke-dashoffset: -28; }
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      
      .pulsing-glow {
        animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <rect width="800" height="180" fill="none" />

  <!-- Links -->
  <line x1="150" y1="90" x2="300" y2="40" class="link" />
  <line x1="150" y1="90" x2="300" y2="140" class="link" />
  <line x1="300" y1="40" x2="450" y2="90" class="link" />
  <line x1="300" y1="140" x2="450" y2="90" class="link" />
  <line x1="450" y1="90" x2="650" y2="90" class="link" />
  
  <!-- Active glowing link lines -->
  <line x1="150" y1="90" x2="300" y2="40" class="active-link" />
  <line x1="300" y1="140" x2="450" y2="90" class="active-link" />
  <line x1="450" y1="90" x2="650" y2="90" class="active-link" />

  <!-- Secondary nodes -->
  <line x1="300" y1="40" x2="250" y2="15" class="link" />
  <line x1="300" y1="140" x2="350" y2="165" class="link" />
  <line x1="450" y1="90" x2="500" y2="40" class="link" />
  <line x1="450" y1="90" x2="400" y2="140" class="link" />

  <!-- Nodes -->
  <!-- Layer 1 -->
  <g transform="translate(150, 90)">
    <circle r="12" fill="#00FF66" fill-opacity="0.1" class="pulsing-glow" />
    <circle r="4" class="node" />
  </g>
  
  <!-- Layer 2 -->
  <g transform="translate(300, 40)">
    <circle r="12" fill="#00FF66" fill-opacity="0.1" class="pulsing-glow" />
    <circle r="4" class="node" />
  </g>
  <g transform="translate(300, 140)">
    <circle r="4" class="node" />
  </g>
  
  <!-- Layer 3 -->
  <g transform="translate(450, 90)">
    <circle r="16" fill="#00FF66" fill-opacity="0.1" class="pulsing-glow" />
    <circle r="5" class="core-node" />
  </g>
  
  <!-- Layer 4 -->
  <g transform="translate(650, 90)">
    <circle r="12" fill="#00FF66" fill-opacity="0.1" class="pulsing-glow" />
    <circle r="4" class="node" />
  </g>

  <!-- Peripheral nodes -->
  <circle cx="250" cy="15" r="2.5" class="node" />
  <circle cx="350" cy="165" r="2.5" class="node" />
  <circle cx="500" cy="40" r="3" class="node" />
  <circle cx="400" cy="140" r="3" class="node" />
</svg>
