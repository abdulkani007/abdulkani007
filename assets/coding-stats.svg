<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .profile-title {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.05em;
      }
      
      .stat-num {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 900;
        font-size: 30px;
        fill: #FFFFFF;
        letter-spacing: -0.02em;
      }
      
      .stat-lbl {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 10px;
        fill: #64748B;
      }

      .detail-txt {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 500;
        font-size: 9px;
        fill: #00FF66;
      }

      .card-bg {
        fill: #070D19;
        fill-opacity: 0.6;
        stroke: #00FF66;
        stroke-opacity: 0.2;
        stroke-width: 1.2;
      }
      
      .section-heading {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 800;
        font-size: 12px;
        fill: #EAB308;
        letter-spacing: 0.15em;
      }
    </style>
  </defs>

  <!-- Background Cover -->
  <rect width="800" height="180" rx="4" fill="#030712" stroke="#1E293B" stroke-width="1.2" />
  
  <!-- Heading -->
  <text x="30" y="32" class="section-heading">&gt; ALGORITHMIC_METRICS_AUDIT</text>

  <!-- Card 1: LeetCode -->
  <g transform="translate(30, 48)">
    <rect width="175" height="102" rx="4" class="card-bg" />
    <rect x="0" y="0" width="175" height="3" fill="#FFA116" />
    <text x="15" y="24" class="profile-title" fill="#FFA116">LEETCODE</text>
    <text x="15" y="58" class="stat-num">200+</text>
    <text x="15" y="73" class="stat-lbl">SOLVED PROBLEMS</text>
    <text x="15" y="88" class="detail-txt">RATING: 1620 // #658K</text>
  </g>

  <!-- Card 2: Skillrack -->
  <g transform="translate(220, 48)">
    <rect width="175" height="102" rx="4" class="card-bg" />
    <rect x="0" y="0" width="175" height="3" fill="#3B82F6" />
    <text x="15" y="24" class="profile-title" fill="#3B82F6">SKILLRACK</text>
    <text x="15" y="58" class="stat-num">1120+</text>
    <text x="15" y="73" class="stat-lbl">SOLVED CHALLENGES</text>
    <text x="15" y="88" class="detail-txt">VERIFIED PLATFORM</text>
  </g>

  <!-- Card 3: CodeChef -->
  <g transform="translate(410, 48)">
    <rect width="175" height="102" rx="4" class="card-bg" />
    <rect x="0" y="0" width="175" height="3" fill="#D0011B" />
    <text x="15" y="24" class="profile-title" fill="#D0011B">CODECHEF</text>
    <text x="15" y="58" class="stat-num">300+</text>
    <text x="15" y="73" class="stat-lbl">COMPLETED TASKS</text>
    <text x="15" y="88" class="detail-txt">ACTIVE CODE COMPETITOR</text>
  </g>

  <!-- Card 4: HackerRank -->
  <g transform="translate(600, 48)">
    <rect width="170" height="102" rx="4" class="card-bg" />
    <rect x="0" y="0" width="170" height="3" fill="#2EC866" />
    <text x="15" y="24" class="profile-title" fill="#2EC866">HACKERRANK</text>
    <text x="15" y="50" font-family="Fira Code, ui-monospace, monospace" font-size="16" font-weight="900" fill="#FFFFFF">Java 5★</text>
    <text x="15" y="68" font-family="Fira Code, ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF">C++ 2★ | SQL 2★</text>
    <text x="15" y="86" class="detail-txt">C 1★ | Python 1★</text>
  </g>
</svg>
