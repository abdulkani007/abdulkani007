<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.015" stroke-width="1" />
    </pattern>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.03" />
    </pattern>

    <!-- Gradients -->
    <radialGradient id="glow-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0B132B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-bottom-right" cx="90%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-top-left" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for abstract lines -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="#030712" />

  <!-- Ambient Glows -->
  <rect width="800" height="600" fill="url(#glow-center)" />
  <rect width="800" height="600" fill="url(#glow-top-left)" />
  <rect width="800" height="600" fill="url(#glow-bottom-right)" />

  <!-- Grids -->
  <rect width="800" height="600" fill="url(#grid)" />
  <rect width="800" height="600" fill="url(#dot-grid)" />

  <!-- Abstract Geometry (Cybernetic Cyber-lines) -->
  <path d="M 0 100 L 200 100 L 250 150 L 550 150 L 600 100 L 800 100" fill="none" stroke="url(#line-grad)" stroke-width="1.5" stroke-dasharray="10 5" />
  <path d="M 0 500 L 300 500 L 350 450 L 450 450 L 500 500 L 800 500" fill="none" stroke="url(#line-grad)" stroke-width="1" />

  <!-- Corner tech brackets -->
  <!-- Top Left -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />
  <!-- Top Right -->
  <path d="M 780 40 L 780 20 L 760 20" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />
  <!-- Bottom Left -->
  <path d="M 20 560 L 20 580 L 40 580" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />
  <!-- Bottom Right -->
  <path d="M 780 560 L 780 580 L 760 580" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="2" />
</svg>
