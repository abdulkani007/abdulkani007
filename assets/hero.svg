<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Monospace Systems Fonts & Typing Animations -->
    <style type="text/css">
      .brand-title {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 800;
        font-size: 38px;
        fill: #00FF66;
        letter-spacing: 0.05em;
        filter: drop-shadow(0 0 4px rgba(0, 255, 102, 0.4));
      }
      
      .brand-subtitle {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 14px;
        fill: #EAB308; /* Amber alert theme color */
        letter-spacing: 0.15em;
      }
      
      .brand-desc {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 400;
        font-size: 14px;
        fill: #E2E8F0;
        line-height: 1.6;
      }

      .tech-tag {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #00FF66;
        font-weight: 700;
      }
      
      /* Typing Animation for Name */
      @keyframes type-name {
        0%, 10% { width: 0; }
        70%, 90% { width: 330px; }
        100% { width: 330px; }
      }

      @keyframes move-cursor {
        0%, 10% { transform: translateX(0); }
        70%, 90% { transform: translateX(330px); }
        100% { transform: translateX(330px); }
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      #clip-rect {
        animation: type-name 5s steps(12, end) infinite alternate;
      }

      #name-cursor {
        animation: blink 0.8s step-end infinite, move-cursor 5s steps(12, end) infinite alternate;
      }

      /* Glowing animations */
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 255, 102, 0.4)) drop-shadow(0 0 8px rgba(0, 255, 102, 0.2)); }
        50% { filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.8)) drop-shadow(0 0 20px rgba(0, 255, 102, 0.4)); }
      }

      @keyframes floatNet {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }

      .pulse-glow {
        animation: neonPulse 4s ease-in-out infinite;
      }

      .float-network {
        animation: floatNet 8s ease-in-out infinite;
        transform-origin: center;
      }

      .rotating-ring {
        transform-origin: 640px 175px;
        animation: spin 30s linear infinite;
      }

      .rotating-ring-reverse {
        transform-origin: 640px 175px;
        animation: spin-back 20s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spin-back {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="cyber-green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#00AA44" />
    </linearGradient>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#070D19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <radialGradient id="spotlight-green" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlight-amber" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- SOC Cyber Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF66" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="0" cy="0" r="1.2" fill="#00FF66" fill-opacity="0.08" />
    </pattern>

    <!-- Clip Path for typing animation -->
    <clipPath id="clip-name">
      <rect id="clip-rect" x="65" y="90" width="0" height="60" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="350" fill="url(#bg-glow)" />
  <rect width="800" height="350" fill="url(#tech-grid)" />
  
  <!-- Spotlights -->
  <rect width="800" height="350" fill="url(#spotlight-green)" />
  <rect width="800" height="350" fill="url(#spotlight-amber)" />

  <!-- SOC Border Container with Neon Cyber Green Borders -->
  <rect x="25" y="25" width="750" height="300" rx="4" fill="#050811" fill-opacity="0.75" stroke="url(#cyber-green-glow)" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Glowing SOC corners decoration -->
  <path d="M 27 55 L 27 27 L 55 27" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2.5" />
  <path d="M 773 55 L 773 27 L 745 27" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2.5" />
  <path d="M 27 295 L 27 323 L 55 323" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2.5" />
  <path d="M 773 295 L 773 323 L 745 323" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2.5" />

  <!-- Cybermatic Scanner / Ring on the Right -->
  <g class="float-network">
    <circle cx="640" cy="175" r="75" fill="none" stroke="url(#cyber-green-glow)" stroke-opacity="0.08" stroke-width="1" />
    <circle class="rotating-ring" cx="640" cy="175" r="65" fill="none" stroke="#00FF66" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="12 25 35 15" stroke-linecap="square" />
    <circle class="rotating-ring-reverse" cx="640" cy="175" r="50" fill="none" stroke="#EAB308" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="25 15 5 15" />
    
    <!-- Central Active Core -->
    <circle cx="640" cy="175" r="10" fill="url(#cyber-green-glow)" class="pulse-glow" />
    <circle cx="640" cy="175" r="25" fill="none" stroke="#00FF66" stroke-opacity="0.1" stroke-width="3">
      <animate attributeName="r" values="10;38;10" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Content (Left Column) -->
  <g transform="translate(0, 0)">
    <!-- Subtitle / SOC prompt -->
    <text x="65" y="95" class="brand-subtitle">&gt; SECURE_SOC_CONNECT // PORT_ACTIVE</text>
    
    <!-- Title / Main Name with typing animation -->
    <g clip-path="url(#clip-name)">
      <text x="65" y="140" class="brand-title">ABDUL KANI.B</text>
    </g>
    <!-- Typing Cursor -->
    <rect id="name-cursor" x="65" y="105" width="4" height="40" fill="#00FF66" />
    
    <rect x="65" y="160" width="220" height="2" fill="url(#cyber-green-glow)" />
    
    <!-- Role & Institution -->
    <text x="65" y="195" class="brand-desc" fill="#00FF66" font-weight="700">AI ENGINEER &amp; FULL-STACK DEVELOPER</text>
    <text x="65" y="220" class="brand-desc">SPECIALIZATION: SECURE_AI_AGENTS // MERN</text>
    
    <!-- Tech Stack Mini Tags -->
    <g transform="translate(65, 250)">
      <rect x="0" y="0" width="70" height="20" fill="#071E14" stroke="#00FF66" stroke-opacity="0.4" />
      <text x="35" y="13" class="tech-tag" text-anchor="middle">PYTHON</text>
      
      <rect x="80" y="0" width="75" height="20" fill="#071E14" stroke="#00FF66" stroke-opacity="0.4" />
      <text x="117.5" y="13" class="tech-tag" text-anchor="middle">MERN</text>
      
      <rect x="165" y="0" width="95" height="20" fill="#071E14" stroke="#00FF66" stroke-opacity="0.4" />
      <text x="212.5" y="13" class="tech-tag" text-anchor="middle">CYBER_AI</text>
    </g>

    <!-- Operational Status Indicator -->
    <g transform="translate(65, 295)">
      <circle cx="6" cy="6" r="4" fill="#00FF66" class="pulse-glow" />
      <circle cx="6" cy="6" r="8" fill="none" stroke="#00FF66" stroke-width="1">
        <animate attributeName="r" values="4;12;4" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#94A3B8" font-weight="700">STATUS: AUDITING_THREATS // EXECUTING_SOC_AGENTS</text>
    </g>
  </g>
</svg>
