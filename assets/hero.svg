<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- System Fonts -->
    <style type="text/css">
      .brand-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.03em;
      }
      
      .brand-subtitle {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-weight: 700;
        font-size: 14px;
        fill: #00E5FF;
        letter-spacing: 0.2em;
      }
      
      .brand-desc {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 300;
        font-size: 16px;
        fill: #94A3B8;
        line-height: 1.6;
      }

      .tech-tag {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        fill: #3B82F6;
        font-weight: 600;
      }
      
      /* Glowing animations */
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 229, 255, 0.4)) drop-shadow(0 0 8px rgba(0, 229, 255, 0.2)); }
        50% { filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.8)) drop-shadow(0 0 20px rgba(0, 229, 255, 0.4)); }
      }

      @keyframes floatNet {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }

      .pulse-glow {
        animation: neonPulse 4s ease-in-out infinite;
      }

      .float-network {
        animation: floatNet 8s ease-in-out infinite;
        transform-origin: center;
      }

      .rotating-ring {
        transform-origin: 640px 175px;
        animation: spin 30s linear infinite;
      }

      .rotating-ring-reverse {
        transform-origin: 640px 175px;
        animation: spin-back 20s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes spin-back {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      /* Typwriter cursor effect */
      @keyframes blink {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
      .cursor {
        animation: blink 0.8s step-end infinite;
        fill: #00E5FF;
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    
    <linearGradient id="cyber-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="spotlight-cyan" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="spotlight-blue" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#3B82F6" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="#3B82F6" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="350" fill="url(#bg-glow)" />
  <rect width="800" height="350" fill="url(#tech-grid)" />
  
  <!-- Spotlights -->
  <rect width="800" height="350" fill="url(#spotlight-cyan)" />
  <rect width="800" height="350" fill="url(#spotlight-blue)" />

  <!-- Glassmorphism Container with Premium Neon Borders -->
  <rect x="25" y="25" width="750" height="300" rx="20" fill="#0B1329" fill-opacity="0.4" stroke="url(#neon-blue)" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Glowing corners decoration -->
  <path d="M 30 55 L 30 35 L 50 35" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 770 55 L 770 35 L 750 35" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 30 295 L 30 315 L 50 315" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 770 295 L 770 315 L 750 315" fill="none" stroke="#00E5FF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />

  <!-- Animated Cybermatic Tech Ring on the Right -->
  <g class="float-network">
    <!-- Outer dashed rotating ring -->
    <circle cx="640" cy="175" r="75" fill="none" stroke="url(#neon-blue)" stroke-opacity="0.1" stroke-width="1" />
    <circle class="rotating-ring" cx="640" cy="175" r="65" fill="none" stroke="url(#neon-blue)" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="10 20 40 20" stroke-linecap="round" />
    <circle class="rotating-ring-reverse" cx="640" cy="175" r="50" fill="none" stroke="url(#cyber-purple)" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="30 15 5 15" />
    
    <!-- Central Glowing Core -->
    <circle cx="640" cy="175" r="12" fill="url(#neon-blue)" class="pulse-glow" />
    <circle cx="640" cy="175" r="28" fill="none" stroke="#00E5FF" stroke-opacity="0.1" stroke-width="4">
      <animate attributeName="r" values="12;40;12" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Content (Left Column) -->
  <g transform="translate(65, 75)">
    <!-- Subtitle / Role console tag -->
    <text x="0" y="20" class="brand-subtitle">&lt;SYSTEM_INIT: ABDUL KANI.B /&gt;</text>
    
    <!-- Title / Main Name with glowing accent -->
    <text x="0" y="70" class="brand-title">ABDUL KANI.B</text>
    <rect x="0" y="85" width="220" height="4" rx="2" fill="url(#neon-blue)" />
    
    <!-- Role & Institution -->
    <text x="0" y="125" class="brand-desc" font-weight="600" fill="#FFFFFF">AI Engineer &amp; Full-Stack MERN Developer</text>
    <text x="0" y="150" class="brand-desc">B.Tech IT @ Sri Eshwar College Of Engineering</text>
    
    <!-- Tech Stack Mini Badges Visual -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="70" height="20" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.3" />
      <text x="35" y="14" class="tech-tag" text-anchor="middle">PYTHON</text>
      
      <rect x="80" y="0" width="75" height="20" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.3" />
      <text x="117.5" y="14" class="tech-tag" text-anchor="middle">MERN</text>
      
      <rect x="165" y="0" width="90" height="20" rx="4" fill="#1E293B" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.3" />
      <text x="210" y="14" class="tech-tag" text-anchor="middle">AGENTIC_AI</text>
    </g>

    <!-- Operational Status Indicator -->
    <g transform="translate(0, 225)">
      <circle cx="6" cy="6" r="5" fill="#00E5FF" class="pulse-glow" />
      <circle cx="6" cy="6" r="10" fill="none" stroke="#00E5FF" stroke-width="1.5">
        <animate attributeName="r" values="5;14;5" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#94A3B8" font-weight="700" letter-spacing="1">STATUS: COMPILING_FUTURE // REGION: IN_SECE</text>
    </g>
  </g>
</svg>
