<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .hdr-text {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 800;
        font-size: 12px;
        fill: #EAB308;
        letter-spacing: 0.15em;
      }
      
      .log-txt {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        fill: #E2E8F0;
      }

      .log-date {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        fill: #64748B;
      }

      .card-bg {
        fill: #050811;
        stroke: #00FF66;
        stroke-opacity: 0.15;
        stroke-width: 1.2;
      }

      @keyframes log-type {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .l-line { animation: log-type 0.4s forwards; opacity: 0; }
      .ll-1 { animation-delay: 0.2s; }
      .ll-2 { animation-delay: 0.8s; }
      .ll-3 { animation-delay: 1.4s; }
      .ll-4 { animation-delay: 2.0s; }
      .ll-5 { animation-delay: 2.6s; }
      .ll-6 { animation-delay: 3.2s; }
    </style>
  </defs>

  <!-- Shell Frame -->
  <rect width="800" height="200" rx="4" fill="#030712" stroke="#1E293B" stroke-width="1.2" />
  <rect x="15" y="15" width="770" height="170" rx="2" class="card-bg" />

  <!-- Corner Brackets -->
  <path d="M 17 35 L 17 17 L 35 17" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2" />
  <path d="M 783 35 L 783 17 L 765 17" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2" />
  <path d="M 17 165 L 17 183 L 35 183" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2" />
  <path d="M 783 165 L 783 183 L 765 183" fill="none" stroke="#00FF66" stroke-opacity="0.8" stroke-width="2" />

  <!-- Header -->
  <text x="35" y="42" class="hdr-text">&gt; OPERATIONAL_HISTORY_LOGS</text>

  <!-- Log Entries -->
  <g class="l-line ll-1" transform="translate(35, 70)">
    <text x="0" y="0"><tspan class="log-date">[2025-12-01]</tspan> <tspan fill="#38BDF8">CONNECTING TO SECURE PORT...</tspan></text>
  </g>

  <g class="l-line ll-2" transform="translate(35, 90)">
    <text x="0" y="0"><tspan class="log-date">[2025-12-05]</tspan> <tspan fill="#00FF66">iGenuine Solutions Pvt. Ltd -- MERN Stack Intern [OFFLINE]</tspan></text>
  </g>

  <g class="l-line ll-3" transform="translate(35, 110)">
    <text x="0" y="0"><tspan class="log-date">[2025-12-10]</tspan> <tspan class="log-txt">&gt; Implemented JWT secure routes and authentication guards.</tspan></text>
  </g>

  <g class="l-line ll-4" transform="translate(35, 130)">
    <text x="0" y="0"><tspan class="log-date">[2025-12-15]</tspan> <tspan class="log-txt">&gt; Optimized MongoDB schemas and secure REST API endpoints.</tspan></text>
  </g>

  <g class="l-line ll-5" transform="translate(35, 150)">
    <text x="0" y="0"><tspan class="log-date">[2025-12-20]</tspan> <tspan class="log-txt">&gt; Integrated Socket.io real-time chat gateway.</tspan></text>
  </g>

  <g class="l-line ll-6" transform="translate(35, 170)">
    <text x="0" y="0"><tspan class="log-date">[2025-12-30]</tspan> <tspan fill="#EAB308">INTERNSHIP CYCLE COMPLETED // SESSION CLOSED.</tspan></text>
  </g>
</svg>
