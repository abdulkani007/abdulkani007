<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .footer-txt {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #94A3B8;
        letter-spacing: 0.15em;
        text-anchor: middle;
      }
      .brand-txt {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 700;
        fill: #00FF66;
        letter-spacing: 0.2em;
        text-anchor: middle;
      }
    </style>
    <linearGradient id="footer-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" stop-opacity="0" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="100" fill="url(#footer-fade)" />

  <!-- Accent Divider Line -->
  <rect x="100" y="20" width="600" height="1.5" fill="url(#line-grad)" />

  <!-- Center Text -->
  <text x="400" y="50" class="brand-txt">ABDUL KANI // SOC MONITOR RUNNING</text>
  <text x="400" y="75" class="footer-txt">CONSTRUCTED WITH PRECISION // VERSION 2026.2</text>

  <!-- Tech Dots -->
  <circle cx="50" cy="50" r="2" fill="#EAB308" opacity="0.5" />
  <circle cx="750" cy="50" r="2" fill="#00FF66" opacity="0.5" />
</svg>
