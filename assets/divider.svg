<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="100%">
  <defs>
    <!-- Glowing green gradient -->
    <linearGradient id="glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FF66" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="1" />
      <stop offset="75%" stop-color="#00FF66" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background transparent -->
  <rect width="800" height="20" fill="none" />
  
  <!-- Glowing neon line -->
  <line x1="50" y1="10" x2="750" y2="10" stroke="url(#glow-line)" stroke-width="1.5" filter="url(#neon-glow)" />
</svg>
