<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 12" width="100%" height="100%">
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="15%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#00E5FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background line -->
  <rect x="0" y="5" width="800" height="2" rx="1" fill="url(#line-grad)" />
  <!-- Glowing pulse animating across the line -->
  <rect x="0" y="4" width="80" height="4" rx="2" fill="url(#pulse-grad)">
    <animate attributeName="x" values="-80;800" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
