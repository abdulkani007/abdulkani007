<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .panel-bg { fill: #070D19; stroke: #1E293B; stroke-width: 1.5; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748B; font-weight: 600; }
      .val { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #F8FAFC; font-weight: 700; }
      .title-txt { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #94A3B8; font-weight: 600; }
    </style>
    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="280" height="160" rx="8" class="panel-bg" />
  
  <!-- Top Bar Mockup -->
  <rect x="15" y="15" width="250" height="24" rx="4" fill="#0B1528" stroke="#1E293B" stroke-width="1" />
  <circle cx="28" cy="27" r="3" fill="#EF4444" />
  <circle cx="38" cy="27" r="3" fill="#F59E0B" />
  <circle cx="48" cy="27" r="3" fill="#10B981" />
  <text x="140" y="30" class="title-txt" text-anchor="middle">agenticloan-ai // system_monitor</text>

  <!-- Left: OCR status check -->
  <g transform="translate(15, 52)">
    <rect width="125" height="92" rx="4" fill="#0B1528" stroke="#1E293B" stroke-width="1" />
    <text x="10" y="20" class="lbl">OCR DOCUMENT SCANNER</text>
    
    <text x="10" y="38" class="val">PAN CARD:</text>
    <text x="80" y="38" class="val" fill="#10B981">PASSED</text>
    
    <text x="10" y="58" class="val">PAYSLIP:</text>
    <text x="80" y="58" class="val" fill="#10B981">PASSED</text>

    <text x="10" y="78" class="lbl">VERIFICATION ACCURACY</text>
    <text x="100" y="78" class="val" fill="#00E5FF">98.7%</text>
  </g>

  <!-- Right: Score Ring -->
  <g transform="translate(155, 52)">
    <rect width="110" height="92" rx="4" fill="#0B1528" stroke="#1E293B" stroke-width="1" />
    <circle cx="55" cy="40" r="22" fill="none" stroke="#1E293B" stroke-width="3" />
    <circle cx="55" cy="40" r="22" fill="none" stroke="url(#grad-cyan-blue)" stroke-width="3" stroke-dasharray="138" stroke-dashoffset="30" stroke-linecap="round" />
    <text x="55" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="900">94.2%</text>
    <text x="55" y="76" class="lbl" text-anchor="middle">ELIGIBILITY SCORE</text>
  </g>
</svg>
