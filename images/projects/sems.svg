<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="100%" height="100%">
  <defs>
    <style type="text/css">
      .panel-bg { fill: #070D19; stroke: #1E293B; stroke-width: 1.5; }
      .lbl { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; fill: #64748B; font-weight: 600; }
      .val { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #F8FAFC; font-weight: 700; }
      .title-txt { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #94A3B8; font-weight: 600; }
    </style>
  </defs>
  <rect width="280" height="160" rx="8" class="panel-bg" />
  
  <!-- Top Bar Mockup -->
  <rect x="15" y="15" width="250" height="24" rx="4" fill="#0B1528" stroke="#1E293B" stroke-width="1" />
  <circle cx="28" cy="27" r="3" fill="#EF4444" />
  <circle cx="38" cy="27" r="3" fill="#F59E0B" />
  <circle cx="48" cy="27" r="3" fill="#10B981" />
  <text x="140" y="30" class="title-txt" text-anchor="middle">sems // verification_gateway</text>

  <!-- Left: QR Code Mockup -->
  <g transform="translate(15, 52)">
    <rect width="125" height="92" rx="4" fill="#0B1528" stroke="#1E293B" stroke-width="1" />
    <text x="10" y="18" class="lbl">TICKET SCANNER</text>
    
    <!-- QR Outer Position Squares -->
    <rect x="15" y="30" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <rect x="19" y="34" width="8" height="8" fill="#FFFFFF" />
    
    <rect x="50" y="30" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <rect x="54" y="34" width="8" height="8" fill="#FFFFFF" />

    <rect x="15" y="62" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <rect x="19" y="66" width="8" height="8" fill="#FFFFFF" />

    <!-- QR Random dots pattern -->
    <rect x="50" y="62" width="5" height="5" fill="#00E5FF" />
    <rect x="61" y="62" width="5" height="5" fill="#3B82F6" />
    <rect x="50" y="73" width="5" height="5" fill="#3B82F6" />
    <rect x="61" y="73" width="5" height="5" fill="#FFFFFF" />
  </g>

  <!-- Right: Verification Success -->
  <g transform="translate(155, 52)">
    <rect width="110" height="92" rx="4" fill="#0B1528" stroke="#1E293B" stroke-width="1" />
    <circle cx="55" cy="35" r="16" fill="#10B981" fill-opacity="0.2" />
    <path d="M 47 35 L 52 40 L 63 29" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <text x="55" y="70" class="lbl" text-anchor="middle">VERIFICATION</text>
    <text x="55" y="82" class="val" text-anchor="middle" fill="#10B981">SUCCESSFUL</text>
  </g>
</svg>
